            const d = [ " .Mon" , " .Tue" , " .Wed" , " .Thu" , " .Fri" ] ;

            const classroom = " span:nth-child(2)" ; 
            function changeClass() 
            {
                for( let di = 0 ; di < d.length ; di ++ ) 
                {
                    for( let i = 1 ; i <= 10 ; i ++ ) 
                    {
                        $( "." + i + d[di] + name ).text( "" ) ; 
                        $( "." + i + d[di] + teacher ).text( "" ) ;

                        $( "." + i + d[di] + name ).text( aa.find( a => ( a.S == $("select#se").val() ) ).Table[i - 1].Week[di].Name ) ;
